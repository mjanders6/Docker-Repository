{% extends "base.html" %}
{% block title %}New Note{% endblock %}
{% block content %}
<form class="new-form" method="post" action="/new">
  <h2>New Note</h2>
  <label>Title
    <input type="text" name="title" placeholder="Note title" required autofocus>
  </label>
  <label>Class
    <select name="class">
      <option value="">(none)</option>
      {% for c in classes %}
        <option value="{{ c.name }}" {{ 'selected' if c.name == class_name }}>
          {{ c.icon or '' }} {{ c.label or c.name }}
        </option>
      {% endfor %}
    </select>
  </label>
  <label>Notebook
    <select name="notebook">
      <option value="">(loose note)</option>
      {% for notebook_name in notebooks %}<option value="{{ notebook_name }}" {{ 'selected' if notebook_name == notebook }}>📓 {{ notebook_name }}</option>{% endfor %}
    </select>
  </label>
  <label>Parent note (optional)
    <select name="parent">
      <option value="">(top-level note)</option>
      {% for n in all_notes %}<option value="{{ n.slug }}" {{ 'selected' if n.slug == parent }}>{{ n.title }}</option>{% endfor %}
    </select>
  </label>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Create</button>
    <a class="btn" href="/">Cancel</a>
  </div>
</form>
{% endblock %}
