{% extends "base.html" %}
{% block title %}Editing {{ note.metadata.title }}{% endblock %}
{% block content %}
<form class="edit-form" method="post" action="/note/{{ note.slug }}/save">
  <div class="edit-toprow">
    <input type="text" name="title" value="{{ note.metadata.title or '' }}" placeholder="Title" class="title-input">
    <a class="btn" href="/note/{{ note.slug }}">Cancel</a>
    <button class="btn btn-primary" type="submit">Save</button>
  </div>

  <div class="edit-meta-row">
    <label>Class
      <select name="class" id="class-select">
        <option value="">(none)</option>
        {% for c in classes %}
          <option value="{{ c.name }}" {{ 'selected' if c.name == note.metadata.class }}>
            {{ c.icon or '' }} {{ c.label or c.name }}
          </option>
        {% endfor %}
      </select>
    </label>
    <label>Date
      <input type="date" name="date" value="{{ note.metadata.date or '' }}">
    </label>
    <label>Tags (comma separated)
      <input type="text" name="tags" value="{{ (note.metadata.tags or []) | join(', ') }}">
    </label>
    <label>Notebook
      <select name="notebook">
        <option value="">(loose note)</option>
        {% for notebook in notebooks %}<option value="{{ notebook }}" {{ 'selected' if notebook == note.metadata.notebook }}>📓 {{ notebook }}</option>{% endfor %}
      </select>
    </label>
    <label>Parent note (optional)
      <select name="parent">
        <option value="">(top-level note)</option>
        {% for n in all_notes %}<option value="{{ n.slug }}" {{ 'selected' if n.slug == note.metadata.parent }}>{{ n.title }}</option>{% endfor %}
      </select>
    </label>
  </div>

  <div class="edit-class-fields" id="class-fields-container">
    {% include "_class_fields.html" %}
  </div>

  <div class="link-insert-row">
    <input type="text" id="link-picker" list="note-titles-list"
           placeholder="Link a note by title (new titles create it on click)...">
    <datalist id="note-titles-list">
      {% for n in all_notes %}<option value="{{ n.title }}">{% endfor %}
    </datalist>
    <button type="button" class="btn" id="insert-link-btn">+ Insert Link</button>
  </div>

  <div class="editor-split">
    <textarea name="body" id="body-input" class="body-textarea"
              placeholder="Write markdown here...">{{ note.body }}</textarea>
    <div id="preview-pane" class="preview-pane"></div>
  </div>
</form>

<script>
  const textarea = document.getElementById('body-input');
  const preview = document.getElementById('preview-pane');
  let timer = null;

  async function updatePreview() {
    const res = await fetch('/preview', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'body=' + encodeURIComponent(textarea.value),
    });
    preview.innerHTML = await res.text();
  }

  textarea.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(updatePreview, 300);
  });
  updatePreview();

  // "+ Insert Link" wraps whatever's typed as a [[wikilink]] and drops it
  // in at the cursor. If the title matches an existing note (the datalist
  // options above) it'll resolve to that note; otherwise it renders as a
  // "click to create" link once saved.
  const linkPicker = document.getElementById('link-picker');
  const insertLinkBtn = document.getElementById('insert-link-btn');
  let lastCursorPos = null;
  textarea.addEventListener('blur', () => { lastCursorPos = textarea.selectionStart; });

  insertLinkBtn.addEventListener('click', () => {
    const title = linkPicker.value.trim();
    if (!title) { linkPicker.focus(); return; }
    const snippet = `[[${title}]]`;
    const pos = lastCursorPos != null ? lastCursorPos : textarea.value.length;
    textarea.value = textarea.value.slice(0, pos) + snippet + textarea.value.slice(pos);
    lastCursorPos = pos + snippet.length;
    linkPicker.value = '';
    updatePreview();
  });

  // Task-list checkboxes are live in the preview pane too, but the note
  // isn't saved yet -- so a click flips the [ ]/[x] marker directly in
  // the textarea (same 0-based indexing render_tasks/toggle_task use
  // server-side) and re-renders the preview, instead of hitting the
  // toggle-task endpoint.
  function toggleTaskInText(text, index) {
    const re = /^(\s*[-*+] )\[([ xX])\] (.*)$/gm;
    let i = 0;
    return text.replace(re, (match, prefix, mark, rest) => {
      const isTarget = i === index;
      i += 1;
      if (!isTarget) return match;
      const newMark = mark.toLowerCase() === 'x' ? ' ' : 'x';
      return `${prefix}[${newMark}] ${rest}`;
    });
  }

  preview.addEventListener('change', (e) => {
    if (!e.target.classList.contains('task-checkbox')) return;
    const idx = parseInt(e.target.dataset.taskIndex, 10);
    textarea.value = toggleTaskInText(textarea.value, idx);
    updatePreview();
  });

  // Switching the class swaps in that class's extra fields (empty/default
  // values -- any values entered under the previous class aren't carried
  // over unless the two classes happen to share a field name).
  const classSelect = document.getElementById('class-select');
  const fieldsContainer = document.getElementById('class-fields-container');

  classSelect.addEventListener('change', async () => {
    const name = classSelect.value;
    if (!name) {
      fieldsContainer.innerHTML = '';
      return;
    }
    const res = await fetch(`/classes/${encodeURIComponent(name)}/fields-partial`);
    fieldsContainer.innerHTML = await res.text();
    initMultiselectComponents();
  });

  // Initialize multiselect components
  function initMultiselectComponents() {
    document.querySelectorAll('.multiselect-wrapper').forEach(wrapper => {
      const fieldName = wrapper.dataset.field;
      const selected = wrapper.querySelector('.multiselect-selected');
      const dropdown = wrapper.querySelector('.multiselect-dropdown');
      const searchInput = wrapper.querySelector('.multiselect-search');
      const filterInput = wrapper.querySelector('.multiselect-filter');
      const options = wrapper.querySelectorAll('.multiselect-option');
      const tagRemoveButtons = wrapper.querySelectorAll('.multiselect-tag-remove');

      // Show/hide dropdown
      const toggleDropdown = (show) => {
        dropdown.style.display = show ? 'flex' : 'none';
        if (show) filterInput?.focus();
      };

      selected.addEventListener('click', (e) => {
        if (e.target.classList.contains('multiselect-tag-remove')) return;
        toggleDropdown(dropdown.style.display === 'none');
      });

      searchInput.addEventListener('focus', () => toggleDropdown(true));
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') toggleDropdown(false);
      });

      // Filter options
      filterInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        options.forEach(option => {
          const label = option.querySelector('.multiselect-option-label').textContent.toLowerCase();
          option.classList.toggle('hidden', !label.includes(query));
        });
      });

      // Handle checkbox changes
      options.forEach(option => {
        const checkbox = option.querySelector('.multiselect-checkbox');
        checkbox.addEventListener('change', () => {
          updateMultiselectDisplay(wrapper);
        });
      });

      // Remove tag
      tagRemoveButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const tag = btn.closest('.multiselect-tag');
          const value = tag.dataset.value;
          const checkbox = Array.from(options)
            .find(opt => opt.dataset.value === value)
            ?.querySelector('.multiselect-checkbox');
          if (checkbox) {
            checkbox.checked = false;
            updateMultiselectDisplay(wrapper);
          }
        });
      });

      // Close dropdown when clicking outside
      document.addEventListener('click', (e) => {
        if (!wrapper.contains(e.target)) {
          toggleDropdown(false);
        }
      });
    });
  }

  function updateMultiselectDisplay(wrapper) {
    const options = wrapper.querySelectorAll('.multiselect-option');
    const selected = wrapper.querySelector('.multiselect-selected');
    const hiddenInputsDiv = wrapper.querySelector('.multiselect-hidden-inputs');
    const fieldName = wrapper.dataset.field;

    const checkedValues = Array.from(options)
      .filter(opt => opt.querySelector('.multiselect-checkbox').checked)
      .map(opt => opt.dataset.value);

    // Update tags
    const tagsHtml = checkedValues
      .map(val => `
        <span class="multiselect-tag" data-value="${val}">
          ${val}
          <button type="button" class="multiselect-tag-remove" aria-label="Remove ${val}">&times;</button>
        </span>
      `).join('');

    const searchInput = selected.querySelector('.multiselect-search');
    selected.innerHTML = tagsHtml + `
      <input type="text" class="multiselect-search" placeholder="Search or add..." autocomplete="off">
    `;

    // Re-attach event listeners to new remove buttons
    selected.querySelectorAll('.multiselect-tag-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const tag = btn.closest('.multiselect-tag');
        const value = tag.dataset.value;
        const checkbox = Array.from(options)
          .find(opt => opt.dataset.value === value)
          ?.querySelector('.multiselect-checkbox');
        if (checkbox) {
          checkbox.checked = false;
          updateMultiselectDisplay(wrapper);
        }
      });
    });

    // Update hidden inputs for form submission
    hiddenInputsDiv.innerHTML = checkedValues
      .map(val => `<input type="hidden" name="${fieldName}" value="${val}">`)
      .join('');

    // Re-attach focus handler to new search input
    selected.querySelector('.multiselect-search').addEventListener('focus', () => {
      wrapper.querySelector('.multiselect-dropdown').style.display = 'flex';
    });
  }

  // Initialize multiselect on page load
  initMultiselectComponents();
</script>
{% endblock %}
