{% macro render_note_tree(nodes, active_slug='') %}
  <ul class="note-tree">
    {% for n in nodes %}
      <li class="note-tree-item">
        {% if n.children %}
        <details class="note-tree-node" open>
          <summary class="note-row{{ ' active' if n.slug == active_slug else '' }}" title="{{ n.title }}">
            <span class="note-row-icon" aria-hidden="true">📄</span>
            <a class="note-row-link" href="/note/{{ n.slug }}" onclick="event.stopPropagation()">{{ n.title }}</a>
          </summary>
          {{ render_note_tree(n.children, active_slug) }}
        </details>
        {% else %}
        <div class="note-row note-row-leaf{{ ' active' if n.slug == active_slug else '' }}" title="{{ n.title }}">
          <span class="note-row-spacer" aria-hidden="true"></span>
          <span class="note-row-icon" aria-hidden="true">📄</span>
          <a class="note-row-link" href="/note/{{ n.slug }}">{{ n.title }}</a>
        </div>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
{% endmacro %}
