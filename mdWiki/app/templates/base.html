<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">📓 {{ app_name }}<span class="version-tag">v{{ app_version }}</span></a>
    <nav class="topnav">
      <a href="/" class="{{ 'active' if request.url.path == '/' }}">Notes</a>
      <a href="/classes" class="{{ 'active' if request.url.path.startswith('/classes') }}">Classes</a>
      <a href="/help" class="{{ 'active' if request.url.path == '/help' }}">Help</a>
      <a class="new-btn" href="/new">+ New Note</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
